<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #1a1a2e;
      background-image: url("../assets/weather.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
    }

    .app {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  padding: 32px;
  width: 100%;
  max-width: 420px;
}
    

    h1 {
      font-size: 1.3rem;
      color: White;
      margin-bottom: 20px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #1a1a2e;
    }

    button {
      background: #1a1a2e;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
    }

    button:hover { opacity: 0.8; }

    .weather-card {
      display: none;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      color: white;
      text-align: center;
      padding: 16px 0;
    }

    .city-name {
      font-size: 3rem;
      font-weight: 700;
      color: White;
      margin-bottom: 4px;
    }

    .weather-icon {
      width: 80px;
      height: 80px;
      margin: 8px auto;
    }

    .temp {
      font-size: 3rem;
      font-weight: 700;
      color: White;
      line-height: 1;
      margin-bottom: 8px;
    }

    .description {
      font-size: 1rem;
      color: rgba(255,255,255,0.8);
      text-transform: capitalize;
      margin-bottom: 20px;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .detail-box {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }

    .detail-label {
      font-size: 0.75rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a1a2e;
    }

    .error {
      display: none;
      text-align: center;
      color: #e74c3c;
      font-size: 0.9rem;
      padding: 12px;
      background: #fdf0f0;
      border-radius: 8px;
    }

    .loading {
      display: none;
      text-align: center;
      color: #999;
      font-size: 0.9rem;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Weather</h1>
    <div class="search-row">
      <input type="text" id="city-input" placeholder="Enter a city or town...">
      <button id="search-btn">Search</button>
    </div>
    <p class="loading" id="loading">Fetching weather...</p>
    <p class="error" id="error">City not found. Try again.</p>
    <div class="weather-card" id="weather-card">
      <p class="city-name" id="city-name"></p>
      <img class="weather-icon" id="weather-icon" src="" alt="weather icon">
      <p class="temp" id="temp"></p>
      <p class="description" id="description"></p>
      <div class="details">
        <div class="detail-box">
          <p class="detail-label">Feels like</p>
          <p class="detail-value" id="feels-like"></p>
        </div>
        <div class="detail-box">
          <p class="detail-label">Humidity</p>
          <p class="detail-value" id="humidity"></p>
        </div>
        <div class="detail-box">
          <p class="detail-label">Wind</p>
          <p class="detail-value" id="wind"></p>
        </div>
        <div class="detail-box">
          <p class="detail-label">Condition</p>
          <p class="detail-value" id="condition"></p>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
